name: Split Audiobook

# Maintenance tool: splits ONE full-book audio file (mp3/mp4/m4a) stored in the
# taylor-audio bucket into per-lesson chapter slots, cutting at the "Chapter N"
# announcements that begin each lesson. Exits green with a notice when the
# source file hasn't been uploaded yet.
# Re-run 2026-07-04: repair ch01/ch02 after an accidental in-app merge.

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/split-audiobook.yml'
      - 'scripts/split-audiobook.mjs'
  workflow_dispatch:
    inputs:
      book_id:
        description: 'Book id (edward | coraline)'
        default: 'coraline'
      src_url:
        description: 'External share link (Google Drive/Dropbox/direct) — big files that exceed the Supabase upload limit'
        default: ''
      src_path:
        description: 'Storage path of the full-book audio (used when src_url is empty)'
        default: 'v1/coraline/ch1.mp3'
      boundaries:
        description: 'Book chapters that START lessons 2..K'
        default: '3,5,7,10,12'

concurrency:
  group: split-audiobook
  cancel-in-progress: false

jobs:
  split:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install ffmpeg
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg

      - name: Split audiobook into lesson chapters
        env:
          BOOK_ID: ${{ inputs.book_id || 'coraline' }}
          # On push-triggered runs, the source link below is used (set it, push,
          # and the split runs); workflow_dispatch input overrides it.
          SRC_URL: ${{ inputs.src_url || 'https://drive.google.com/file/d/1bNhkAycCEgxnZLg_vAYKO7F2KbOr15rF/view?usp=drivesdk' }}
          SRC_PATH: ${{ inputs.src_path || 'v1/coraline/ch1.mp3' }}
          BOUNDARIES: ${{ inputs.boundaries || '3,5,7,10,12' }}
        run: node scripts/split-audiobook.mjs
