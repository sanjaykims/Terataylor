name: Upload Bridge Audio

# Pushes a batch of Bridge C1/C2 class mp3s from assets/bridge-audio/ into the
# taylor-audio bucket and points each lesson's audio key at them.
#
# MANUAL ONLY (workflow_dispatch), and intentionally so: this overwrites lesson
# audio and clears the sentence timings aligned against the old audio. It should
# run when a new batch of class audio arrives, not on every push.
#
# The mp3s do not live on main - a term of audio is ~26 MB and main stays lean.
# Push the batch to a scratch branch, then run this workflow against that ref:
#   Actions > Upload Bridge Audio > Run workflow > Use workflow from: <branch>
# Run once with dry_run to check the file -> lesson mapping before writing.

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Print the file → lesson plan without uploading'
        type: boolean
        default: false
      only_book:
        description: 'Limit to one book (bridge_c1 | bridge_c2). Empty = both.'
        default: ''

concurrency:
  group: upload-bridge-audio
  cancel-in-progress: false

jobs:
  upload:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Upload Bridge audio
        env:
          DRY_RUN: ${{ inputs.dry_run && '1' || '0' }}
          ONLY_BOOK: ${{ inputs.only_book }}
        run: node scripts/upload-bridge-audio.mjs
