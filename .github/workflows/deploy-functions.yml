name: Deploy Edge Functions

# Auto-deploys Supabase edge functions whenever their source changes on main.
# One-time setup: create a Supabase access token (https://supabase.com/dashboard/account/tokens)
# and add it as a GitHub repo secret named SUPABASE_ACCESS_TOKEN
# (Settings → Secrets and variables → Actions → New repository secret).

on:
  push:
    branches: [main]
    paths:
      - 'supabase/functions/**'
      - '.github/workflows/deploy-functions.yml'
  workflow_dispatch: {}   # allow manual "Run workflow" from the Actions tab

concurrency:
  group: deploy-edge-functions
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      PROJECT_REF: aeygqjuhqjvlhjrslbxd
    steps:
      - uses: actions/checkout@v4

      - name: Fail early if the access token secret is missing
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ]; then
            echo "::error::SUPABASE_ACCESS_TOKEN secret is not set. Add it under" \
                 "Settings → Secrets and variables → Actions, then re-run."
            exit 1
          fi

      - uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Deploy all edge functions
        run: supabase functions deploy --project-ref "$PROJECT_REF"
