name: Inspect Audio

# READ-ONLY diagnostic for chapter audio state (KV rows, file sizes, real vs
# estimated durations) plus an ffmpeg -ss/-to semantics check.

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/inspect-audio.yml'
      - 'scripts/inspect-audio.mjs'
  workflow_dispatch:
    inputs:
      book_id:
        description: 'Book id (edward | coraline)'
        default: 'coraline'
      chapter_count:
        description: 'Number of lesson chapters to scan'
        default: '6'

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install ffmpeg
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg

      - name: Inspect chapter audio
        env:
          BOOK_ID: ${{ inputs.book_id || 'coraline' }}
          CHAPTER_COUNT: ${{ inputs.chapter_count || '6' }}
        run: node scripts/inspect-audio.mjs
