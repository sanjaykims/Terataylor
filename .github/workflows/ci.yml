name: CI

on:
  push:
    branches: [main, 'claude/**']
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - run: npm ci

      - name: Check edge function files exist
        run: |
          test -f supabase/functions/ocr-extract/index.ts     || (echo "ERROR: ocr-extract/index.ts missing"     && exit 1)
          test -f supabase/functions/deepgram-listen/index.ts || (echo "ERROR: deepgram-listen/index.ts missing" && exit 1)
          test -f supabase/functions/merge-audio/index.ts     || (echo "ERROR: merge-audio/index.ts missing"     && exit 1)

      - name: Lint
        run: npm run lint

      - name: Build (type-check + bundle)
        run: npm run build
